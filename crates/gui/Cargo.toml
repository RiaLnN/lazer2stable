[package]
name = "lazer2stable-gui"
version = "0.1.0"
edition = "2021"
authors = ["lazer2stable contributors"]
description = "Desktop graphical interface for lazer2stable migration"

[dependencies]
lazer2stable-core = { path = "../core" }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.31"
egui_extras = { version = "0.31", features = ["svg", "image"] }
tokio = { version = "1.43", features = ["full"] }
crossbeam-channel = "0.5"
rfd = "0.15"
tracing-subscriber = "0.3"
tracing = "0.1"
anyhow = "1.0"
