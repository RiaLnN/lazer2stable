[package]
name = "lazer2stable-cli"
version = "0.1.0"
edition = "2021"
authors = ["lazer2stable contributors"]
description = "Command-line interface for lazer2stable migration"

[dependencies]
lazer2stable-core = { path = "../core" }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.43", features = ["full"] }
indicatif = "0.17"
tracing-subscriber = "0.3"
tracing = "0.1"
anyhow = "1.0"
